// :falconer-noop — the empty mirror. Linked ONLY for the release variant via
// `releaseImplementation`. Depends on :falconer-core (+ coroutines-core for Flow)
// and NOTHING else: no Compose, no SQLDelight, no manifest components. When this
// is the engine on the classpath, ServiceLoader resolves the empty impl, nothing
// references the inspector, and R8 strips it from the release APK.
apply plugin: "com.android.library"
apply plugin: "kotlin-android"
// See :falconer-core — Central publication driven by gradle.properties.
apply plugin: "com.vanniktech.maven.publish"

android {
    namespace = "dev.alifhasnain.falconer.noop"
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    dependencies {
        // The seam only — no heavy deps. core re-exports coroutines-core (Flow).
        api project(":falconer-core")
    }
}
