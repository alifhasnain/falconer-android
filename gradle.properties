# JVM heap for the Gradle daemon (Compose + SQLDelight codegen are memory-hungry).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by Compose / lifecycle / core-ktx.
android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official

# --- shared versions (referenced by every module's build.gradle) -------------
# All three Maven artifacts ship on ONE version, released in lockstep — the
# no-op's FalconerEngine surface must always match core (RELEASE_STRIPPING.md §3.6).
# Pre-release: kept in step with the pub package version (pubspec.yaml).
falconerVersion=0.1.0

# Pinned toolchain (matches the plugin's android/ module — see falconer/CLAUDE.md).
kotlinVersion=2.1.0
sqldelightVersion=2.2.1
