# JVM heap for the Gradle daemon (Compose + SQLDelight codegen are memory-hungry).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by Compose / lifecycle / core-ktx.
android.useAndroidX=true
android.enableJetifier=false

kotlin.code.style=official

# Pinned toolchain (matches the plugin's android/ module — see falconer/CLAUDE.md).
kotlinVersion=2.1.0
sqldelightVersion=2.2.1

# ============================================================================
# Maven Central publishing (Sonatype Central Portal) via the vanniktech plugin.
# ============================================================================
# Coordinates. GROUP is the Central-verified namespace: io.github.<user> needs
# no domain (verified by GitHub ownership). All three artifacts ship on ONE
# version, in lockstep (RELEASE_STRIPPING.md §3.6).
GROUP=io.github.alifhasnain
VERSION_NAME=0.2.1

# Publish to the new Central Portal (not the legacy OSSRH), and sign releases.
# Signing keys + Sonatype credentials are supplied at publish time via env /
# ~/.gradle/gradle.properties (NOT committed) — see README "Publishing".
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=false
RELEASE_SIGNING_ENABLED=true

# Shared POM metadata (Central rejects incomplete POMs). Per-module NAME /
# DESCRIPTION / ARTIFACT_ID live in each module's own gradle.properties.
POM_URL=https://github.com/alifhasnain/falconer-android
POM_INCEPTION_YEAR=2026

POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo

POM_SCM_URL=https://github.com/alifhasnain/falconer-android
POM_SCM_CONNECTION=scm:git:git://github.com/alifhasnain/falconer-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/alifhasnain/falconer-android.git

POM_DEVELOPER_ID=alifhasnain
POM_DEVELOPER_NAME=alifhasnain
POM_DEVELOPER_URL=https://github.com/alifhasnain/
