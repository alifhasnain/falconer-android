// Root build for the falconer-android Maven artifacts.
//
// Legacy `buildscript {}` + `apply plugin:` style (mirrors the plugin's own
// android/build.gradle): plugins resolve from the buildscript classpath below,
// so the modules apply them with `apply plugin:` rather than the plugins {} DSL.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.9.1"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        // Standalone Compose Compiler Gradle plugin (Kotlin 2.0+). Its version MUST
        // equal the Kotlin version. Replaces the legacy composeOptions{} block.
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlinVersion"
        // SQLDelight — generates type-safe DB code from .sq files via a Gradle
        // task (no KSP/kapt, so no cross-drive relativeTo crash on Windows).
        classpath "app.cash.sqldelight:gradle-plugin:$sqldelightVersion"
        // Maven Central publishing: signing, sources/javadoc jars, full POM, and
        // the Central Portal upload — all driven by the GROUP / VERSION_NAME /
        // POM_* / SONATYPE_* properties in gradle.properties.
        classpath "com.vanniktech:gradle-maven-publish-plugin:0.30.0"
    }
}

allprojects {
    // group + version are set from GROUP / VERSION_NAME (gradle.properties) by
    // the vanniktech plugin on each published module. Central requires a verified
    // namespace, so the group is io.github.alifhasnain (NOT the JitPack
    // com.github.* form). Consumers resolve from mavenCentral().
    repositories {
        google()
        mavenCentral()
    }
}
